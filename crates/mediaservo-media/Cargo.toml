[package]
name = "mediaservo-media"
version.workspace = true
edition.workspace = true
description = "MediaServo Media — video frame types, buffers, source/sink pipeline, transforms"
license.workspace = true

[dependencies]
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["clock"] }
rand = "0.8"
yuv-sys = { version = "0.3", optional = true }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time", "macros"] }


[dev-dependencies]
image = "0.25"
# eframe/egui left with the egui examples (batch ④: they live in examples/rs now,
# where the package declares them itself) — tests here only need image

[features]
default = ["backend-yuv-sys", "capture-v4l2"]
backend-yuv-sys = ["dep:yuv-sys"]
backend-native = []
capture-v4l2 = ["dep:v4l"]

[target.'cfg(target_os = "linux")'.dependencies]
v4l = { version = "0.14", optional = true }

[package.metadata.docs.rs]
features = ["backend-yuv-sys"]

# example lanes relocated to examples/rs (plan directory-artifacts-convergence batch ④;
# the required-features they declared ride the examples package dependency graph now)
