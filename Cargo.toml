[workspace]
members = ["crates/mediaservo-host", 
    "crates/mediaservo-client", 
    "crates/mediaservo-server", 
    "crates/mediaservo-common", 
    "crates/mediaservo-webrtc", 
    "crates/mediaservo-media", 
    "crates/mediaservo-codec", 
    "crates/mediaservo-link", 
    "crates/mediaservo-deck", 
    "crates/mediaservo-field", 
"crates/mediaservo-weaknet", 
    "bindings/c/mediaservo-field-c",
    "bindings/c/mediaservo-link-c",
    "bindings/c/mediaservo-deck-c",
    "bindings/cxx/mediaservo-link-cxx",
    "bindings/cxx/mediaservo-deck-cxx",
    "bindings/cxx/mediaservo-field-cxx",
    "bindings/node/rust/mediaservo-node"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

# MediaServo vendored patch (PIT-76): webrtc-sys 0.3.41 补全
# RtpEncodingParameters.request_key_frame 字段（libwebrtc GenerateKeyFrame 标准路径，
# 用于 Host 周期关键帧触发）。上游 livekit 未暴露此字段。
# 升级 webrtc-sys 前必须检查 upstream 是否已含该字段，含则删除此 patch。
[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
