# G3 cockpit account registry — operator accounts (D-H11 dual-identity model, operator side).
# Storage decision same as devices.yaml: one-way hash sha256(username + ":" + password) only,
# username acts as the salt (consistent with G2 devices); unknown user vs wrong password produce byte-identical wire responses (anti-enumeration).
# Provisioning flow:
#   1. Generate the hash: echo -n "carol:s3cret" | sha256sum  → 64 hex
#   2. Fill in password_hash: "sha256:<64 hex>"
#   3. role: viewer|operator|admin|dispatcher (unknown role → account unusable)
#   4. vehicles: vehicle×cockpit allowlist of device_ids (enforced for viewer/operator; admin/dispatcher may omit — any vehicle)
#   5. Restart the server (`./mediaservo.sh restart server`) — the registry loads at startup
# Login: POST /api/auth/login {username, password} → JWT {sub, role, vehicles, iat, exp}
#       (HS256, same secret as admin_jwt_secret; 12h session)
# Emergency stop: operator/admin may send (strong audit: who/when/which vehicle/what command); viewer/dispatcher may not.
# Example (placeholder — delete or replace):
# accounts:
#   carol:
#     password_hash: "sha256:<64 hex>"
#     role: operator
#     vehicles: ["ms-0a1b2c3d4e5f"]
#   admin:
#     password_hash: "sha256:<64 hex>"
#     role: admin
# Development accounts (placeholder — replace before deployment): local Docker dev + H3 frontend e2e only.
#   admin:      admin123     → role admin (all capabilities)
#   dispatcher: dispatch123 → role dispatcher (audio/status/video-monitoring read-only)
#   operator:   operator123 → role operator (I1: no admin REST access → the frontend hides monitoring navigation)
