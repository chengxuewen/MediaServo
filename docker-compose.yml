# Production stack — one all-in-one container: mediaservo-server + caddy (web
# gateway) + oxmgr (process manager, PID 1). caddy serves the browser on 8080;
# there is no separate proxy container.
#
# Site usage (nothing but docker compose needed):
#   cp .env.example .env    # fill the four required variables
#   docker compose --env-file .env up -d
# The ${VAR:?} interpolations below refuse to start on an empty required
# variable — that fail-fast is intentional.
#
# .env contract (four required vars, passed through to the container): TAG,
#   MEDIASERVO_SFU_ANNOUNCED_IP, MEDIASERVO_ADMIN_PASSWORD, SSH_PORT.
#   MEDIASERVO_BRAND defaults to mediaservo — override only for a
#   differently-branded image (volume paths interpolate the SAME brand, so
#   mounts never go dead). MEM_LIMIT is an optional capacity knob (see the
#   recommended ladder in .env.example).
name: ${MEDIASERVO_BRAND:-mediaservo}
services:
  server:
    image: ${MEDIASERVO_BRAND:-mediaservo}-server:${TAG:?set TAG in .env — explicit image pin for rollback}
    ports:
      # Host-side ports are env-overridable (useful for running isolated stacks
      # on one host); container-side targets are fixed.
      - "${WEB_PORT:-8080}:8080"                       # browser entry (admin/voice/API/WS)
      - "${AGENT_PORT:-9800}:9800"                     # host-agent direct /ws
      - "${SSH_PORT:-2222}:22"                         # ssh maintenance (2222 avoids the CentOS host sshd)
      - "${SFU_PORT:-20000}:20000/udp"                 # SFU media (single-port mux)
      - "${SFU_PORT_RANGE:-40000-40100}:40000-40100/udp"  # legacy range, unused by the current model — safe to drop
    environment:
      RUST_LOG: info
      # Single brand source: the entrypoint paths and the volume mounts below
      # resolve the same value.
      MEDIASERVO_BRAND: ${MEDIASERVO_BRAND:-mediaservo}
      # Multi-NIC sites MUST fill this in .env with a client-reachable IP:
      # auto-detection concatenates all NIC IPs but the SFU uses only the first,
      # which on multi-NIC hosts is often an unreachable internal interface —
      # signaling works, media silently fails.
      MEDIASERVO_SFU_ANNOUNCED_IP: ${MEDIASERVO_SFU_ANNOUNCED_IP:?set MEDIASERVO_SFU_ANNOUNCED_IP in .env — site-reachable IP, multi-NIC explicit-fill}
      # first-boot admin bootstrap (init step 3); persisted in the etc volume.
      MEDIASERVO_ADMIN_PASSWORD: ${MEDIASERVO_ADMIN_PASSWORD:?set MEDIASERVO_ADMIN_PASSWORD in .env — first-boot admin account}
    # Memory limit only (host protection); CPU is unlimited so RTP bursts stay
    # smooth. The 512m default is MEASURED at the standard tier (10 rooms /
    # 20 peers @720p: peak 56.81 MiB, ~9x headroom); see the MEM_LIMIT ladder
    # in .env.example before raising it.
    mem_limit: ${MEM_LIMIT:-512m}
    restart: unless-stopped
    # Named volumes at the brand-derived tree paths; the first-boot init is the
    # single writer that seeds secrets/configs into the etc volume.
    volumes:
      - mediaservo-data:/opt/${MEDIASERVO_BRAND:-mediaservo}/etc
      - mediaservo-recordings:/opt/${MEDIASERVO_BRAND:-mediaservo}/recordings
    # The healthcheck is inherited from the image (curl localhost:8080/health;
    # 30s interval, 60s start period). The image's stop signal is SIGINT, so
    # `docker compose stop` shuts down gracefully (~1s, exit 0).

volumes:
  mediaservo-data:
  mediaservo-recordings: