name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check
      - name: Version uniformity gate (C43——crate 版本单一源=workspace，禁自带字面量)
        run: |
          if grep -rn '^version = "' crates/*/Cargo.toml; then
            echo "FAIL: 有 crate 自带 version 字面量——bump 必漏；改 version.workspace = true" && exit 1
          fi
          echo "OK: 全 crate 继承 [workspace.package] 版本"

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-gstreamer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: "0.67.2"
          cache: true
      - run: pixi run test-gstreamer

  test-mediasoup:
    runs-on: ubuntu-22.04  # mediasoup prebuild base (widest glibc compatibility)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mediasoup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libuv1-dev libssl-dev
      - name: Test mediaservo-server (mediasoup)
        run: cargo test -p mediaservo-server --features sfu-mediasoup
      - name: Build mediaservo-server binary (for external-mode e2e)
        run: cargo build -p mediaservo-server --features sfu-mediasoup
      - name: Start mediaservo-server for e2e_sfu (pure external mode)
        run: |
          # C21: e2e_sfu 是纯外部模式 — 需真实 server 进程 + WS 信令交互
          # 注意: server 认证用 MEDIASERVO_PSK env (main.rs:185), 与 e2e_sfu 的 SFU_E2E_PSK 匹配
          MEDIASERVO_PSK="mediaservo-dev" nohup ./target/debug/mediaservo-server > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s --noproxy "*" http://127.0.0.1:9800/health 2>/dev/null | grep -q healthy; then
              echo "server ready after ${i}s"; break;
            fi
            sleep 1
          done
          curl -s --noproxy "*" http://127.0.0.1:9800/health || (cat /tmp/server.log; exit 1)
      - name: e2e_sfu (Host→mediasoup→consume, Linux only)
        run: |
          # 首次 Linux 真跑 — CI 覆盖防 C14 假象重演 (PIT-71/72)
          SFU_E2E_WS_URL="ws://127.0.0.1:9800/ws" \
          SFU_E2E_PSK="mediaservo-dev" \
          cargo test -p mediaservo-host --test e2e_sfu

  test-weaknet:
    name: Weak-net smoke (tc netem smoke on lo)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mediasoup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libuv1-dev libssl-dev
      - name: Preflight netem (PIT-184 反例防线：施加后必回读，静默 no-op 直接红)
        run: |
          sudo modprobe sch_netem || true
          tc -V
          sudo tc qdisc replace dev lo root netem limit 100000 delay 40ms 10ms distribution normal loss 2%
          sudo tc -s qdisc show dev lo | grep "netem" | grep -q "delay 40"
          RTT=$(ping -c 4 -i 0.2 127.0.0.1 2>/dev/null | awk -F/ "END {print \$5}")
          awk -v a="$RTT" "BEGIN{exit !(a>=30)}" || { echo "netem 未生效：ping RTT=$RTTms"; exit 1; }
          echo "netem 生效（ping RTT=${RTT}ms ≈ 2×40ms 口径）"
      - name: Build server + e2e test (external mode)
        run: |
          cargo build -p mediaservo-server --features sfu-mediasoup
          cargo test -p mediaservo-host --test e2e_sfu --no-run
      - name: Start server under impairment
        run: |
          MEDIASERVO_PSK="mediaservo-dev" nohup ./target/debug/mediaservo-server > /tmp/server-weaknet.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s --noproxy "*" http://127.0.0.1:9800/health 2>/dev/null | grep -q healthy && { echo "ready +${i}s"; break; }
            sleep 1
          done
          curl -s --noproxy "*" http://127.0.0.1:9800/health || (cat /tmp/server-weaknet.log; exit 1)
      - name: e2e_sfu under weak network (韧性判据)
        run: |
          # netem 全 lo 命中：信令/ICE/RTCP/RTP 同受 delay+loss——过 = 栈内恢复机制活着
          # （对照口径见主仓 weaknet-harness：真机分侧损伤由 profile --stream/方向规则做）
          SFU_E2E_WS_URL="ws://127.0.0.1:9800/ws" \
          SFU_E2E_PSK="mediaservo-dev" \
          timeout 300 cargo test -p mediaservo-host --test e2e_sfu
      - name: Injection truth (netem dropped counter > 0)
        if: always()
        run: |
          DROP=$(sudo tc -s qdisc show dev lo | grep -oP "dropped \K[0-9]+" | head -1 || echo 0)
          echo "netem dropped=$DROP"
          [ "${DROP:-0}" -gt 0 ] || { echo "注入侧零丢弃=疑似静默失效(PIT-184 同族)"; exit 1; }

      # ==== T10 扩步：mediaservo-weaknet local-root 实环（runner=root 通道，agent 自证）====
      - name: Weaknet crate tests
        run: |
          cargo test -p mediaservo-weaknet
          cargo clippy -p mediaservo-weaknet --all-targets -- -D warnings
      - name: Weaknet agent live loop (local-root, W1/W2/W6 子集全链)
        run: |
          # 先收 preflight 的裸 netem 现场——否则 guard_foreign_root fail-closed 拦 agent apply
          sudo tc qdisc del dev lo root || true
          # loss 参数显式（delay-only 永不 drop——dropped 真值判据的参数据）
          cargo build -p mediaservo-weaknet
          sudo ./target/debug/mediaservo-weaknet apply --rtt 50 --loss 5 --rtp-port 20000 --dir both --duration 120
          sudo ./target/debug/mediaservo-weaknet status | grep -q "iface=lo"
          sudo tc -s qdisc show dev lo | grep -q "loss 5"
          sudo ./target/debug/mediaservo-weaknet set --loss 8
          sudo tc -s qdisc show dev lo | grep -q "loss 8"
          DROP=$(sudo tc -s qdisc show dev lo | grep -oP "dropped \K[0-9]+" | head -1 || echo 0)
          echo "agent-injected dropped=$DROP"
          [ "${DROP:-0}" -gt 0 ] || exit 1
          sudo ./target/debug/mediaservo-weaknet clear
          sudo tc qdisc show dev lo | grep -qE "htb|netem" && { echo "撤除残留"; exit 1; }
          echo "agent 实环链绿（apply→status→指纹→set→dropped→clear 零残留）"

      - name: Teardown (只删自记的 root，回读确认为空)
        if: always()
        run: |
          sudo tc qdisc del dev lo root || true
          sudo tc -s qdisc show dev lo | grep -c netem | grep -q "^0$"

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p mediaservo-server

  openapi-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI spec
        run: |
          python3 -c "
          import yaml, sys
          with open('docs/openapi.yaml') as f:
              spec = yaml.safe_load(f)
          assert spec.get('openapi') == '3.0.3', 'not OpenAPI 3.0.3'
          assert spec.get('info', {}).get('title'), 'missing info.title'
          assert spec.get('info', {}).get('version'), 'missing info.version'
          assert 'paths' in spec, 'missing paths'
          for path, methods in spec['paths'].items():
              for method, detail in methods.items():
                  assert 'responses' in detail, f'{path} {method} missing responses'
          print('OpenAPI spec valid: ' + spec['info']['title'] + ' v' + spec['info']['version'])
          "
