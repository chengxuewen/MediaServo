# remote-burst -- teleop discriminative tier: bursty loss (the real wireless shape), paired with the D274 tiers as control
# param semantics: loss gemodel p r (1-h) (1-k); p = 1-H probability of entering the bad state, k = 1-K staying in it
# value source: mediasoup-client #1105 community-proven burst shape (8% mean, ~4-packet bursts) + 160ms RTT
rtt_ms: 160
jitter_ms: 30
loss: "8%"
gemodel:
  r: "25%"
  h: "0.2"
  k: "0.05"
rate_mbps: 4
scope:
  media: true
  signaling: false
