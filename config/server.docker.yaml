version: 1
listen:
  host: "0.0.0.0"
  port: 9800
room_capacity: 50
rate_limit: 100
consumer_limit_per_stream: 50
psk: "mediaservo-dev"
jwt_secret: "docker-admin-secret-with-32-plus-bytes!!"  # PIT-49: signaling JWT 认证（与 admin 同 secret）
admin_jwt_secret: "docker-admin-secret-with-32-plus-bytes!!"
devices_file: "/opt/mediaservo/etc/devices.yaml"
accounts_file: "/opt/mediaservo/etc/accounts.yaml"

# SFU 对外公告地址（多网卡/多网络可达 IP；优先级: env MEDIASERVO_SFU_ANNOUNCED_IP > 此处 > 自动探测）
# mediasoup 要求 0.0.0.0 必须配 announced（容器内探测不可达——PIT-44/58/138）
sfu:
  announced_ips:
    - "192.168.2.127"
    - "10.144.0.3"
