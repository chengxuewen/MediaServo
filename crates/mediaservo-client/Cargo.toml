[package]
name = "mediaservo-client"
version = "0.1.2"  # the delivery-surface independent version source (F12/N1 -- internal crates still inherit the workspace)
edition = "2024"
description = "MediaServo Client SDK v2 -- the cockpit/monitoring-side minimal consumption and control library (SFU consume + ControlEnvelope control DC, login JWT)"
license = "Apache-2.0"

[lib]
name = "mediaservo_client"
path = "src/lib.rs"

[dependencies]
mediaservo-common = { path = "../mediaservo-common" }
# the signaling surface's single truth source: WS/PSK/negotiation/heartbeat/re-mount all go through link (the S2 teardown, no private tungstenite)
mediaservo-link = { path = "../mediaservo-link" }
# C12: WebRTC only via the mediaservo-webrtc abstraction layer (the libwebrtc backend); direct webrtc-rs dependency forbidden
mediaservo-webrtc = { path = "../mediaservo-webrtc", default-features = false, features = ["backend-webrtc-sys"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
# the test mock server (sfu_surface) = the direct-WS shape: the server side's accept_async needs tungstenite.
tokio-tungstenite = "0.24"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
# S6 batch 0/K11: the FakeEngine test foundation (absent from release builds; enabled only for test/CI drills)
engine-fake = []
