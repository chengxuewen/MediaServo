[package]
name = "mediaservo-client-c"
build = "build.rs"
version.workspace = true
edition.workspace = true
description = "MediaServo client C ABI — mediaservo_client_* opaque handle bindings (cockpit consumption + control)"
license.workspace = true

[lib]
name = "mediaservo_client"
crate-type = ["cdylib", "staticlib"]

[dependencies]
mediaservo-common = { path = "../../../crates/mediaservo-common" }
mediaservo-client = { path = "../../../crates/mediaservo-client" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde_json = "1"
# C-bridge diagnostics: when the host C++ process has zero subscribers, on_track/ICE watershed logs are all silent
# (confirmed in 09-24 troubleshooting) — the runtime installs a lazy tracing layer; RUST_LOG can turn it off.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
mediaservo-link = { path = "../../../crates/mediaservo-link" }
