[package]
name = "mediaservo-field"
version = "0.1.1"  # 交付面独立版本源（F12/N1——内部 crate 仍继承 workspace）
edition.workspace = true
description = "MediaServo Field — 组合 SDK (field = webrtc + link + deck): 推流/拉流会话门面 + 一行依赖闭环"
license.workspace = true

[dependencies]
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
serde_json = "1"

# 组合: 信令+帧总线 (link) + 采集/录制/回放 (deck) + WebRTC 抽象 (webrtc, backend-webrtc-sys)
mediaservo-common = { path = "../mediaservo-common" }
mediaservo-media = { path = "../mediaservo-media" }
mediaservo-link = { path = "../mediaservo-link" }
mediaservo-deck = { path = "../mediaservo-deck" }
mediaservo-webrtc = { path = "../mediaservo-webrtc", features = ["backend-webrtc-sys"] }
mediaservo-codec = { path = "../mediaservo-codec" }

[dev-dependencies]
tracing-subscriber = "0.3"
