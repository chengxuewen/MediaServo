[package]
name = "mediaservo-common"
version.workspace = true
edition = "2024"
description = "MediaServo shared abstractions: config schemas, error codes, metrics, protocol definitions"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
prometheus-client = "0.22"
hmac = "0.12"
sha2 = "0.10"
jsonwebtoken = "9"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"

