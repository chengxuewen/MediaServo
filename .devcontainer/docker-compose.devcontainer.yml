name: mediaservo-devcontainer

services:
  dev:
    build:
      context: ..
      dockerfile: Dockerfile.dev
      target: devcontainer
    command: sleep infinity
    shm_size: "2gb"
    cap_add:
      - SYS_PTRACE
    # lldb's ptrace needs more than the capability: docker's DEFAULT seccomp
    # and apparmor profiles both block it (measured: A-packet error 8 on
    # /bin/echo with cap alone; both unconfined + SYS_PTRACE = clean hit).
    # Scope: single-purpose dev container, no other services inside.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      MEDIASERVO_CONTAINER_FACE: "1"
      FFMPEG_DIR: /ff
      PKG_CONFIG_PATH: /ff/lib/pkgconfig
      LD_LIBRARY_PATH: /ff/lib
      LK_CUSTOM_WEBRTC: /workspace/.cache/webrtc/linux-x64-release
      DISPLAY: ${DISPLAY}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY}
    volumes:
      - ../../..:/workspace
      - cargo-cache:/workspace/3rdparty/MediaServo/target
      - cargo-registry:/home/vscode/.cargo/registry
      - cmake-build:/workspace/3rdparty/MediaServo/build
      - ffmpeg9-runtime:/ff
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:ro

volumes:
  cargo-cache:
  cargo-registry:
  cmake-build:
  ffmpeg9-runtime:
    external: true
