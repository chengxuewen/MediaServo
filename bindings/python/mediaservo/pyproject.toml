[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaservo"
version = "0.1.1"
description = "MediaServo Python bindings — ctypes over libmediaservo_{field,link,deck} (D227 step 1)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []  # 零依赖: ctypes/dataclasses/unittest 全 stdlib

[tool.setuptools]
packages = ["mediaservo"]

[tool.setuptools.package-data]
mediaservo = ["_libs/*.so*", "_libs/*.dylib", "_libs/*.dll"]
