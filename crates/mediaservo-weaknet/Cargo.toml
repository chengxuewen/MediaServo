[package]
name = "mediaservo-weaknet"
version.workspace = true
edition = "2024"
description = "tc/netem weak-network emulation agent (dual-surface single binary: server surface CLI/serve/panel + vehicle surface CLI/config) -- a product-repo dev tool; the lib surface stays out of bindings/package"
license = "Apache-2.0"

[dependencies]
# all taken as-is from Cargo.lock (T0 verified zero additions); axum/rust-embed arrive with T6/T7
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# T6 control plane (design §Dependencies three-condition gate: axum0.7.9/futures-core0.3.32 are both lock-present, pure Rust, existing tree edges)
axum = "0.7"
futures-core = "0.3"
# T7 embedded panel (design §Files rust-embed): lock-present 8.12.0 (already used by mediaservo-server); debug-embed = debug builds embed too (self-contained binary, the vehicle-surface scp single-file semantics)
rust-embed = { version = "8", features = ["debug-embed"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "sync", "net"] }

# measure (judge port): timestamp parsing only; 0.4 lock-present, zero new transitive deps
chrono = "0.4"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }  # pinned 0.4: the lock holds both 0.4/0.5; axum 0.7's routing oneshot contract goes through 0.4 (T6 api_matrix; util = ServiceExt, non-default, must be explicit)

[[bin]]
name = "mediaservo-weaknet"
path = "src/main.rs"
