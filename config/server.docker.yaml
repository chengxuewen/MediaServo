version: 1
# frontend-process-split D-2=B: keep 0.0.0.0 (host-agent connects /ws directly).
# Precondition for moving to full-convergence A: once the admin API provisions signaling.url and the protocol_version handshake is ready, switch to 127.0.0.1 (Caddy reverse proxy becomes the only entry).
listen:
  host: "0.0.0.0"
  port: 9800
room_capacity: 50
rate_limit: 100
consumer_limit_per_stream: 50
psk: "mediaservo-dev"
jwt_secret: "docker-admin-secret-with-32-plus-bytes!!"  # PIT-49: signaling JWT auth (same secret as admin)
admin_jwt_secret: "docker-admin-secret-with-32-plus-bytes!!"
devices_file: "/opt/mediaservo/etc/devices.yaml"
accounts_file: "/opt/mediaservo/etc/accounts.yaml"
# Accountless API-key credentials (accountless-client-auth T1): api_keys.yaml defaults to this file's directory;
# the exchange endpoint POST /api/auth/exchange {key_id, secret} → short-lived JWT (TTL seconds, default 12h).
# One-click registration from the admin surface: ./msrtc.sh admin page /apikeys or POST /api/admin/apikeys.
#api_keys_file: "/opt/mediaservo/etc/api_keys.yaml"

# Dev-environment exemptions (PIT-160 root fix): config-first, env vars still override (compose form).
# allow_dev_credentials: startup guard accepts the known dev placeholder accounts (admin123 etc.)
#   instead of env MEDIASERVO_ALLOW_DEV_CREDENTIALS=1 — set true in dev trees ONLY, never production.
# allow_dev_enroll: unknown devices auto-register after pubkey verify (controlled private networks)
#   instead of env ALLOW_DEV_ENROLL=1.
#allow_dev_credentials: true
#allow_dev_enroll: true
#api_token_ttl_secs: 43200

# SFU announced address (reachable IP across NICs/networks; precedence: env MEDIASERVO_SFU_ANNOUNCED_IP > here > auto-detect)
# mediasoup requires announced config when listening on 0.0.0.0 (in-container detection is unreachable — PIT-44/58/138)
sfu:
  announced_ips:
    - "192.168.2.127"
    - "10.144.0.3"

# Web static layer (caddy) — default 8080 / instance web/; env MEDIASERVO_WEB_PORT as fallback (yaml config wins, same shape as C35).
# web:
#   port: 8080
#   static_root: "/abs/web"
#
# SFU/weaknet ports — defaults 20000 / 9810 (env MEDIASERVO_SFU_PORT falls back for sfu.port).
# sfu:
#   port: 20000
#   weaknet_port: 9811
