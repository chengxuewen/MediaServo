[package]
name = "mediaservo-field-c"
build = "build.rs"
version.workspace = true
edition.workspace = true
description = "MediaServo Field C ABI — ms_field_* opaque handle bindings (push plane)"
license.workspace = true

[lib]
name = "mediaservo_field"
crate-type = ["cdylib"]

[dependencies]
mediaservo-field = { path = "../../../crates/mediaservo-field" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
