[workspace]
name = "mediaservo"
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

# Media/host runtime dependencies (all environments except the isolated serena env).
# Kept as a feature so serena can have its own Python 3.13 without inheriting GStreamer.
[feature.media.dependencies]
rust = ">=1.85.0,<2"
flatbuffers = ">=24.3.25,<26"
pip = ">=24.0,<26"
pyyaml = "==6.0.2"  # build-cli (PIT-76); serena-agent 2.1.0 pins the same version
pnpm = ">=10.32,<11"  # www frontend build (build web / build server assembly step; packageManager field on the same line — 2026-09-29: new machine failed without pnpm, moved into pixi)
caddy = ">=2.10"       # web entry reverse proxy (msrtc-web cluster entry; missing = deploy silently degrades to no frontend — added 2026-09-29 for new machines)
ripgrep = ">=14.1.0,<15"
# GStreamer 1.24+ (gstreamer-rs 0.23 min=1.14, tested=1.24)
gstreamer = ">=1.24.0,<2"
gst-plugins-base = ">=1.24.0,<2"
gst-plugins-good = ">=1.24.0,<2"
gst-plugins-bad = ">=1.24.0,<2"
pkg-config = ">=0.29.2,<1"
zlib = ">=1.2,<2"
# Agent toolchain runtime (D289/R4): node for the MCP launcher and LSP wrappers
# (pnpm also pulls it; this makes the contract explicit), ruff for scripts/agents.
nodejs = ">=24,<25"
ruff = ">=0.8,<1"

# Development tools (cmake for webrtc-sys, lld for fast linking, extra GStreamer codecs)
[feature.dev.dependencies]
python = "3.12.*"  # dev/test/default/ci; serena keeps its own 3.13
cmake = ">=3.28.0,<4"
lld = ">=18.0,<19"
gst-plugins-ugly = ">=1.24.0,<2"
gst-libav = ">=1.24.0,<2"
compilers = ">=1.0,<2"
clang = ">=15,<20"
llvm = ">=15,<20"
libclang = ">=15,<20"
meson = ">=1.1.0,<2"
ninja = ">=1.11,<2"
openssl = ">=3,<4"

[feature.dev.tasks]
# === Cargo tasks ═════════════════════════════════════════════
# Crates not needing mediasoup — native build (all platforms)
check = "cargo check --workspace --exclude mediaservo-server"
build = "cargo build --workspace --exclude mediaservo-server"
test = "cargo test --workspace --exclude mediaservo-server"
lint = "cargo clippy --workspace --all-targets -- -D warnings"
# === Bindings matrix (link/deck/field × c/cxx/py) ===
# cdylib build + dev .so.<MAJOR> symlink (D241: DT_NEEDED resolution)
build-c = "cargo build -p mediaservo-field-c -p mediaservo-link-c -p mediaservo-deck-c -p mediaservo-client-c && ln -sf libmediaservo_field.so target/debug/libmediaservo_field.so.0 && ln -sf libmediaservo_link.so target/debug/libmediaservo_link.so.0 && ln -sf libmediaservo_deck.so target/debug/libmediaservo_deck.so.0 && ln -sf libmediaservo_client.so target/debug/libmediaservo_client.so.0"
# C++ header-only binding tests (g++ compile + run asserts)
test-cxx = "bash scripts/test-cxx.sh"
# Python ctypes binding tests (stdlib unittest)
test-py = "MEDIASERVO_LIB_DIR=$PWD/target/debug python3 -m unittest discover -s bindings/python/mediaservo/tests"
# Cross-language parity (D227 ⑤: same sequence asserted consistent across three surfaces)
parity-bindings = "bash scripts/parity_bindings.sh"
# ABI drift gate (D248/L2: header declarations ↔ .so exports comparison)
abi-drift = "bash scripts/check-abi-drift.sh"
# Binding-layer live e2e (positive-path regression across three languages; needs server)
e2e-bindings = "bash scripts/e2e-bindings.sh"

# mediaservo-server — Docker build (mediasoup C++ Worker needs Linux + meson)
check-server = "sh -c 'scripts/docker-cargo.sh check -p mediaservo-server --features sfu-mediasoup'"
build-server = "sh -c 'scripts/docker-cargo.sh build -p mediaservo-server --features sfu-mediasoup'"
test-server = "sh -c 'scripts/docker-cargo.sh test -p mediaservo-server --features sfu-mediasoup'"

# mediaservo-server — native build (unset MESON_ARGS/MESON: conda gcc injects -Dbuildtype=release which conflicts with tasks.py --buildtype; unsetting MESON lets tasks.py fall back to the official pip-managed meson==1.11.2+ninja — first run needs network for pip, cached afterwards)
check-server-native = "sh -c 'unset MESON_ARGS; unset MESON; cargo check -p mediaservo-server'"
build-server-native = "sh -c 'unset MESON_ARGS; unset MESON; cargo build -p mediaservo-server'"
test-server-native = "sh -c 'unset MESON_ARGS; unset MESON; cargo test -p mediaservo-server'"


# Tooling (unchanged)
format = "cargo fmt --all -- --check"
format-fix = "cargo fmt --all"
audit = "cargo deny check"
coverage = "cargo tarpaulin --workspace --exclude mediaservo-server --out Html --out Lcov"
test-gstreamer = "LD_LIBRARY_PATH=$PIXI_PROJECT_ROOT/.pixi/envs/dev/lib:$LD_LIBRARY_PATH DYLD_LIBRARY_PATH=$PIXI_PROJECT_ROOT/.pixi/envs/dev/lib:$DYLD_LIBRARY_PATH cargo test -p mediaservo-codec --features backend-gstreamer"
test-sfu = "cargo test -p mediaservo-server --features sfu-mediasoup"

# Docker compose tasks
server = "docker compose up"
server-dev = "docker compose -f docker-compose.dev.yml up"
# CI tools (lightweight CI stages)
[feature.ci.dependencies]

[feature.test.dependencies]

# test-env dependencies (empty table declared; the dev feature already includes what tests need)

[feature.ci.tasks]
ci-check = "cargo check --workspace"
ci-lint = "cargo clippy --workspace --all-targets -- -D warnings"
ci-test = "cargo test --workspace"

# Activation — set MESON for mediasoup-sys (avoids pip-installed meson)
[activation]
env = { MESON = "$CONDA_PREFIX/bin/meson", NINJA = "$CONDA_PREFIX/bin/ninja", LIBCLANG_PATH = "$CONDA_PREFIX/lib", PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig", PATH = "$CONDA_PREFIX/bin:$PATH" }

# Jetson (linux-aarch64): build host/client with the unified JetPack system toolchain (gcc 10.5).
# The conda cross compiler (GCC 14.4) cannot cleanly link JetPack system libraries (glibc 2.35 conflicts +
# tegra transitive deps libEGL/libv4lconvert live only in the system multiarch dirs) — upstream livekit's
# official Jetson flow uses the system toolchain. CARGO_TARGET_*_LINKER must be overridden explicitly:
# conda's rust.sh sets it to the conda cc, which outranks .cargo/config.toml (PIT-85).
# CFLAGS/CXXFLAGS/LDFLAGS cleared: removes conda-injected -isystem/-L so the whole chain stays consistent.
[target.linux-aarch64.activation.env]
CC = "/usr/bin/gcc"
CXX = "/usr/bin/g++"
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER = "/usr/bin/gcc"
CFLAGS = ""
CXXFLAGS = ""
LDFLAGS = ""

# Environments — composable feature groups
# Book toolchain (D290): English-only docs site; no gettext/i18n packages.
[feature.book.dependencies]
mdbook = ">=0.5,<0.6"
markdownlint-cli = ">=0.45,<1"

[feature.book.tasks]
book-build = "python3 scripts/book/book-build.py"
book-check = "python3 scripts/book/book-check.py"
book-check-structure = "python3 scripts/book/book-check.py --structure"

# Serena MCP: semantic/LSP server on its own Python 3.13 environment (D42/D30).
[feature.serena.dependencies]
python = "3.13.*"
rust = ">=1.98,<2"
rust-src = ">=1.98,<2"
rust-analyzer = "*"

[feature.serena.pypi-dependencies]
serena-agent = "==2.1.0"

[feature.serena.target.linux-64.dependencies]
clang-tools = "23.*"

[feature.serena.tasks]
mcp-serena = "bash scripts/agents/serena-launch.sh"

[environments]
runtime = { features = ["media"] }
dev = { features = ["media", "dev"] }
test = { features = ["media", "dev", "test", "book"] }
ci = { features = ["media", "dev", "test", "ci", "book"] }
default = { features = ["media", "dev", "test", "book"] }
serena = { features = ["serena"] }

# Global tasks (available in all environments)
[tasks]
init = "scripts/pixi-init.sh"
shell = "scripts/pixi-shell.sh"
# Agent single-source layer (plan agent-infra-thin-shell, H5 scope)
agents = "python3 scripts/agents/cli.py"
gate-agents = "python3 scripts/agents/cli.py check"
gate-mcp = "python3 scripts/agents/gate_mcp.py"
gate-guards = "python3 scripts/agents/check_guards.py"
gate-memory = "bash scripts/agents/check_memory.sh"
agent-tools = "bash scripts/agents/tools-check.sh"
hooks-install = "bash scripts/agents/install-hooks.sh"
