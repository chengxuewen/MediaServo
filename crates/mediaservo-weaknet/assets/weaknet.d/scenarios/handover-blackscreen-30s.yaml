# handover-blackscreen-30s -- SLA handover approximation (pre-proposal for the S4/PLAN §11.6 patch d)
# approximation notice: tc netem cannot express a real IP change -- this scenario uses a 100% full-loss blackscreen for 30s + a recovery dwell
#   to approximate the protocol surface at the cockpit/vehicle network-switch moment (WS resume / transport rebuild / streamer re-mount).
#   A real IP change = a netns extension item or a real-vehicle day. Baseline pairing and the four metrics: parent-repo evidence/s4-sla.md.
scenario:
  baseline_s: 8
  steps:
    - at_s: 0
      set: {rtt_ms: 0, jitter_ms: 0, loss: "0%"}        # baseline (pairable with a loopback control)
    - at_s: 8
      set: {loss: "100%", rtt_ms: 160}                 # blackscreen in (full loss, protocol stack flying blind 30s)
    - at_s: 38
      set: {rtt_ms: 0, jitter_ms: 0, loss: "0%"}       # recovery (the four-metric timing window opens)
  clear: false
