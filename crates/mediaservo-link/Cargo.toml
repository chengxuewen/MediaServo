[package]
name = "mediaservo-link"
version.workspace = true
edition = "2024"
description = "MediaServo link IPC: SHM frame bus (iceoryx2), registry, static ACL, capability token"
license = "Apache-2.0"

[dependencies]
mediaservo-common = { path = "../mediaservo-common" }
iceoryx2 = "=0.9.3"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
# 测试用本地 mock WS server (accept_async)
