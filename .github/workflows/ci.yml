name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check
      - name: Changelog scope markers (F11-X V4, Unreleased section only)
        # SR6 P3: one executable truth — the Rust face (scripts/gate-changelog.py retired);
        # the former inline copy had drifted in L-numbering (absolute vs section-relative).
        run: cargo run --quiet -p mediaservo-gates -- changelog
      - name: Bindings version parity (C43③ three hand copies, anti-drift)
        # SR6 P3: Rust face = the executed gate (gate-parity.py retired). Truth stays
        # the sdk-field delivery-domain version via cargo metadata (F12), one source.
        run: cargo run --quiet -p mediaservo-gates -- parity
      - name: Version uniformity gate (C43 — crate version single source = workspace; no self-carried literals)
        run: |
          if grep -l '^version = "' crates/*/Cargo.toml | grep -vE "mediaservo-(host|server|field|client)/Cargo.toml"; then
            echo "FAIL: a crate carries its own version literal — bump will miss it; use version.workspace = true" && exit 1
          fi
          echo "OK: every crate inherits [workspace.package] version"
      - name: Changelog currency gate (C43⑥/D280 — workspace version must appear in CHANGELOG.md)
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          grep -q "v$ver" CHANGELOG.md || { echo "FAIL: workspace version $ver has no CHANGELOG section — the bump commit must add the changelog entry in the same commit (human-facing log, AI-drafted)"; exit 1; }
          echo "OK: CHANGELOG.md contains the v$ver section"

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-server-stub:
    # V5 dual-posture gate: stub (--no-default-features) lib+tests compile surface. The 09-17 twin-mine clearance
    # (signaling E0599 / handle_sfu_message test E0425 = silent-regression faces of the cfg gate) is welded into a guard.
    # --all-targets is mandatory: E0425 only surfaces on the tests compile face (lib-only is always green = half evidence).
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mediaservo-server --no-default-features --all-targets

  test-delivery:
    # V5 delivery-surface smoke: out/bindings assembly -> component purity (lightweight components forbid FFmpeg) +
    # find_package COMPONENTS real symbols + pkg-config version reconciliation + ABI inspection.
    # All-system toolchain (no pixi) = the deliverable must work in a clean environment (reverse guard of the N7 incident surface).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (clean-consumer shape)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3-pip
      - name: Delivery smoke
        run: bash scripts/e2e-delivery.sh

  test-cxx:
    # cxx header-only family compile+run gate (four SDK test programs) + C ABI symbol inspection
    # (drift on the three legacy surfaces + the new client surface). Prereq: build-c produces the four cdylibs.
    # ASan/UBSan live rounds belong to device-day (needs a live server).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build C ABI cdylibs (field/link/deck/client)
        run: cargo build -p mediaservo-field-c -p mediaservo-link-c -p mediaservo-deck-c -p mediaservo-client-c
      - name: Dev soname symlinks (loader resolves libmediaservo_*.so.0)
        run: |
          cd target/debug
          for l in field link deck client; do ln -sf libmediaservo_$l.so libmediaservo_$l.so.0; done
      - name: C++ header-only tests
        run: LD_LIBRARY_PATH=$PWD/target/debug bash scripts/test-cxx.sh
      - name: C ABI symbol checks
        run: bash scripts/check-abi-drift.sh && bash scripts/check-abi-client.sh

  test-gui:
    # p3 GUI examples compile+unit gate: SDL3/ImGui come from in-repo archives (file:// FetchContent,
    # zero network), X11/audio backends explicitly OFF in the aggregate root (clean ubuntu dependency surface).
    # Criteria = build example RC=0 + ctest -R core (viewer_core pure-function pins).
    # Live window output (dummy cb=tex meshing, needs a live server+producer) = device-day/self-hosted slot.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cmake/ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build client-c cdylib (SDK_DIR guard input)
        run: cargo build -p mediaservo-client-c
      - name: Dev soname symlinks (same discipline as test-cxx)
        run: cd target/debug && ln -sf libmediaservo_client_c.so libmediaservo_client_c.so.0
      - name: Build GUI examples (aggregated FetchContent, headless combos)
        run: ./mediaservo.sh build example
      - name: ctest viewer_core
        run: ctest --test-dir target/examples/build -R core --output-on-failure

  test-gstreamer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: "0.67.2"
          cache: true
      - run: pixi run test-gstreamer

  test-mediasoup:
    runs-on: ubuntu-22.04  # mediasoup prebuild base (widest glibc compatibility)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mediasoup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libuv1-dev libssl-dev
      - name: Test mediaservo-server (mediasoup)
        run: cargo test -p mediaservo-server --features sfu-mediasoup
      - name: Build mediaservo-server binary (for external-mode e2e)
        run: cargo build -p mediaservo-server --features sfu-mediasoup
      - name: Start mediaservo-server for e2e_sfu (pure external mode)
        run: |
          # C21: e2e_sfu is pure external mode — needs a real server process + WS signaling interaction
          # Note: server auth uses the MEDIASERVO_PSK env (main.rs:185), matching e2e_sfu's SFU_E2E_PSK
          MEDIASERVO_PSK="mediaservo-dev" nohup ./target/debug/mediaservo-server > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s --noproxy "*" http://127.0.0.1:9800/health 2>/dev/null | grep -q healthy; then
              echo "server ready after ${i}s"; break;
            fi
            sleep 1
          done
          curl -s --noproxy "*" http://127.0.0.1:9800/health || (cat /tmp/server.log; exit 1)
      - name: e2e_sfu (Host→mediasoup→consume, Linux only)
        run: |
          # First real Linux run — CI coverage prevents a C14 illusion from recurring (PIT-71/72)
          SFU_E2E_WS_URL="ws://127.0.0.1:9800/ws" \
          SFU_E2E_PSK="mediaservo-dev" \
          cargo test -p mediaservo-host --test e2e_sfu

  test-weaknet:
    name: Weak-net smoke (tc netem smoke on lo)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mediasoup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libuv1-dev libssl-dev
      - name: Preflight netem (PIT-184 counter-example defense — read back after applying, a silent no-op goes red)
        run: |
          sudo modprobe sch_netem || true
          tc -V
          sudo tc qdisc replace dev lo root netem limit 100000 delay 40ms 10ms distribution normal loss 2%
          sudo tc -s qdisc show dev lo | grep "netem" | grep -q "delay 40"
          RTT=$(ping -c 4 -i 0.2 127.0.0.1 2>/dev/null | awk -F/ "END {print \$5}")
          awk -v a="$RTT" "BEGIN{exit !(a>=30)}" || { echo "netem not in effect: ping RTT=$RTTms"; exit 1; }
          echo "netem in effect (ping RTT=${RTT}ms ≈ 2×40ms convention)"
      - name: Build server + e2e test (external mode)
        run: |
          cargo build -p mediaservo-server --features sfu-mediasoup
          cargo test -p mediaservo-host --test e2e_sfu --no-run
      - name: Start server under impairment
        run: |
          MEDIASERVO_PSK="mediaservo-dev" nohup ./target/debug/mediaservo-server > /tmp/server-weaknet.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s --noproxy "*" http://127.0.0.1:9800/health 2>/dev/null | grep -q healthy && { echo "ready +${i}s"; break; }
            sleep 1
          done
          curl -s --noproxy "*" http://127.0.0.1:9800/health || (cat /tmp/server-weaknet.log; exit 1)
      - name: e2e_sfu under weak network (resilience criterion)
        run: |
          # netem hits the whole lo interface: signaling/ICE/RTCP/RTP all take delay+loss — passing = the in-stack recovery mechanisms are alive
          # (comparison conventions live in the parent repo's weaknet-harness: per-side impairment on real hardware is done via profile --stream / direction rules)
          SFU_E2E_WS_URL="ws://127.0.0.1:9800/ws" \
          SFU_E2E_PSK="mediaservo-dev" \
          timeout 300 cargo test -p mediaservo-host --test e2e_sfu
      - name: Injection truth (netem dropped counter > 0)
        if: always()
        run: |
          DROP=$(sudo tc -s qdisc show dev lo | grep -oP "dropped \K[0-9]+" | head -1 || echo 0)
          echo "netem dropped=$DROP"
          [ "${DROP:-0}" -gt 0 ] || { echo "zero drops on the injection side = suspected silent no-op (same family as PIT-184)"; exit 1; }

      # ==== T10 extended steps: mediaservo-weaknet local-root live loop (runner = root channel, agent self-proves) ====
      - name: Weaknet crate tests
        run: |
          cargo test -p mediaservo-weaknet
          cargo clippy -p mediaservo-weaknet --all-targets -- -D warnings
      - name: Weaknet agent live loop (local-root, full chain of the W1/W2/W6 subset)
        run: |
          # First clear the bare netem state left by preflight — otherwise guard_foreign_root fails closed and blocks the agent apply
          sudo tc qdisc del dev lo root || true
          # loss specified explicitly (delay-only never drops — dropped is the truth counter for the assertion)
          cargo build -p mediaservo-weaknet
          sudo ./target/debug/mediaservo-weaknet apply --rtt 50 --loss 5 --rtp-port 20000 --dir both --duration 120
          sudo ./target/debug/mediaservo-weaknet status | grep -q "iface=lo"
          sudo tc -s qdisc show dev lo | grep -q "loss 5"
          sudo ./target/debug/mediaservo-weaknet set --loss 8
          sudo tc -s qdisc show dev lo | grep -q "loss 8"
          DROP=$(sudo tc -s qdisc show dev lo | grep -oP "dropped \K[0-9]+" | head -1 || echo 0)
          echo "agent-injected dropped=$DROP"
          [ "${DROP:-0}" -gt 0 ] || exit 1
          sudo ./target/debug/mediaservo-weaknet clear
          sudo tc qdisc show dev lo | grep -qE "htb|netem" && { echo "teardown residue remains"; exit 1; }
          echo "agent live chain green (apply -> status -> fingerprint -> set -> dropped -> clear leaves no residue)"

      - name: Teardown (delete only the self-recorded root qdisc; read back to confirm empty)
        if: always()
        run: |
          sudo tc qdisc del dev lo root || true
          sudo tc -s qdisc show dev lo | grep -c netem | grep -q "^0$"

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p mediaservo-server

  openapi-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate OpenAPI spec
        # SR6 P3: one semantic source = the Rust face (gate-openapi.py retired).
        # The old inline twin additionally walked per-operation `responses`;
        # the EXECUTED .py gate never did — drift folded, not silently inherited.
        run: cargo run --quiet -p mediaservo-gates -- openapi
