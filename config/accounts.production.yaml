# MediaServo production account registry (D-H11) — no dev placeholder accounts; the server startup guard grants no exemption.
#
# Format same as accounts.yaml: username → {password_hash: "sha256:<hex>", role, vehicles}
#   - password_hash = sha256(username + ":" + password) (username is the salt, one-way)
#   - role: viewer | operator | admin | dispatcher
#   - vehicles: vehicles this account may access (list of device_ids) — dispatcher/admin may omit (any vehicle)
#
# Generate: echo -n "<username>:<password>" | sha256sum
#
# Example:
# accounts:
#   ops-car1:
#     password_hash: "sha256:2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae"
#     role: operator
#     vehicles: ["ms-xxxxxxxxxxxx"]
accounts: {}
