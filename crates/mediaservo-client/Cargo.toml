[package]
name = "mediaservo-client"
version = "0.1.1"  # 交付面独立版本源（F12/N1——内部 crate 仍继承 workspace）
edition = "2024"
description = "MediaServo Client SDK v2 — 舱端/监控侧最小消费与控制库（SFU consume + ControlEnvelope 控制 DC，登录 JWT）"
license = "Apache-2.0"

[lib]
name = "mediaservo_client"
path = "src/lib.rs"

[dependencies]
mediaservo-common = { path = "../mediaservo-common" }
# 信令面单一真源：WS/PSK/协商/心跳/重挂全部走 link（S2 拆解归位，禁私有 tungstenite）
mediaservo-link = { path = "../mediaservo-link" }
# C12：WebRTC 仅经 mediaservo-webrtc 抽象层（libwebrtc 后端），禁直依 webrtc-rs
mediaservo-webrtc = { path = "../mediaservo-webrtc", default-features = false, features = ["backend-webrtc-sys"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
# 测试 mock server（sfu_surface）= 直连 WS 形：服务端侧 accept_async 需tungstenite。
tokio-tungstenite = "0.24"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
