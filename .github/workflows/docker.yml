name: Docker

# Post container-build-rework (single artifact chain): the submodule CI can
# validate the prod compose contract and build the TOOLCHAIN image
# (docker/builder/Dockerfile, self-contained). The tree-packaged prod image
# (docker/server/Dockerfile) is NOT submodule-CI-buildable — it needs the parent
# workspace layers (--build-context wrapcache/oxmgrpkg, R2 materials-ride-the-
# tree) and is built via `./msrtc.sh build image prod` from the parent.
# Registry publish (ghcr push + image smoke) is the deferred R0 publish batch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # PR validation only on build-related changes (guards Dockerfile/compose
    # breakage from merging, PIT-39 lesson)
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'

jobs:
  docker-build:
    runs-on: ubuntu-22.04  # mediasoup prebuild base (widest glibc compatibility)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose config (PIT-32 gate)
        run: |
          # The four-var contract uses ${VAR:?} fail-fast interpolation, which
          # also aborts `compose config` when unset — feed dummy values for the
          # syntax/structure validation only (real values live in the site .env).
          TAG=ci MEDIASERVO_SFU_ANNOUNCED_IP=127.0.0.1 MEDIASERVO_ADMIN_PASSWORD=ci \
            docker compose -f docker-compose.yml config --quiet && echo "prod compose OK"
          # Gate: production compose must NOT contain build: (image:+build: anti-pattern)
          if grep -qE '^\s+build:' docker-compose.yml; then
            echo "ERROR: docker-compose.yml contains build: — PIT-32 anti-pattern (image: never pulled)"
            exit 1
          fi

      - name: Build toolchain image (PR sanity, upstream posture)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/builder/Dockerfile
          push: false
          build-args: |
            MIRROR=upstream
