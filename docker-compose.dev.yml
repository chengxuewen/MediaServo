# Development docker-compose — build-based, source mount
name: mediaservo
services:
  server:
    build:
      context: .
      target: dev
      args:
        HTTP_PROXY: ${http_proxy:-}
        HTTPS_PROXY: ${https_proxy:-}
        NO_PROXY: ${no_proxy:-}
    ports:
      - "9800:9800"
      - "20000:20000/udp"
      - "40000-40100:40000-40100/udp"
    environment:
      RUST_LOG: debug
      MEDIASERVO_PSK: mediaservo-dev
      # I2 review: accounts.docker.yaml 含 dev 占位账号（admin123 等）—
      # 启动守卫 fail-fast；dev 环境显式豁免（生产部署必须移除占位账号）。
      MEDIASERVO_ALLOW_DEV_CREDENTIALS: "1"
      # PIT-58: SFU announced_address 用宿主可达 IP — 容器内探测=172.18.0.2 其他主机不可达。
      # 支持逗号分隔多 IP（宿主多网卡）；由 mediaservo.sh/CLI 自动探测注入，
      # 直接 compose up 时需手动设 MEDIASERVO_SFU_ANNOUNCED_IP
      MEDIASERVO_SFU_ANNOUNCED_IP: ${MEDIASERVO_SFU_ANNOUNCED_IP:-10.144.0.3,192.168.2.127}
      # 容器内进程（mediasoup-sys meson wrapdb）需要独立代理 (PIT-38)
      HTTPS_PROXY: ${https_proxy:-}
      NO_PROXY: ${no_proxy:-}
    volumes:
      - .:/workspace
      # 运行时配置目录（B: 配置模板 config/*.docker.yaml → data/etc/; API 写回 atomic rename 需目录级挂载——单文件 bind mount 无法 rename-over,PIT-133）
      - ./data/etc:/opt/mediaservo/etc:rw
      - cargo-cache:/workspace/target
    command: cargo run --bin mediaservo-server --features sfu-mediasoup,admin-dashboard
    cap_add:
      - SYS_PTRACE  # 调试: 容器内 gdb attach (produce 挂起诊断)

  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  cargo-cache: