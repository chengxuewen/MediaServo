[package]
name = "mediaservo-host"
version = "0.1.0"
edition = "2024"
description = "MediaServo Remote Host — V4L2 capture, NVENC encode, WebRTC push (field/vehicle side)"
license = "Apache-2.0"

# 9 个 bin 全部显式声明，禁止 autodiscovery（src/bin/ 下 host-legacy 的模块文件
# 会被误判为 bin target）
autobins = false

[lib]
name = "mediaservo_host"
path = "src/lib.rs"

[[bin]]
name = "mediaservo-host"
path = "src/bin/host.rs"

[[bin]]
name = "host-agent"
path = "src/bin/host-agent.rs"

[[bin]]
name = "host-capturer"
path = "src/bin/host-capturer.rs"

[[bin]]
name = "host-streamer"
path = "src/bin/host-streamer.rs"

[[bin]]
name = "host-recorder"
path = "src/bin/host-recorder.rs"

[[bin]]
name = "host-controller"
path = "src/bin/host-controller.rs"

[[bin]]
name = "host-emergency"
path = "src/bin/host-emergency.rs"

[[bin]]
name = "host-audio"
path = "src/bin/host-audio.rs"

[[bin]]
name = "host-legacy"
path = "src/bin/host-legacy.rs"

[dependencies]
mediaservo-common = { path = "../mediaservo-common" }
mediaservo-link = { path = "../mediaservo-link" }
mediaservo-media = { path = "../mediaservo-media" }
# 推流会话门面（C2: host-streamer 复用 PushSession 信令+SFU 协商+track 发布）
mediaservo-field = { path = "../mediaservo-field" }
# 录制（C3: host-recorder 复用 deck Recorder; backend-ffmpeg = FFmpeg H264/MP4 mux）
mediaservo-deck = { path = "../mediaservo-deck", features = ["backend-ffmpeg"] }
mediaservo-codec = { path = "../mediaservo-codec" }
# GStreamer (optional — requires system GStreamer on Linux/Jetson)
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }
gstreamer-video = { version = "0.23", optional = true }

# WebRTC — only via mediaservo-webrtc abstraction (C12)
mediaservo-webrtc = { path = "../mediaservo-webrtc", features = ["backend-webrtc-sys"] }
# Legacy P2P webrtc-rs dependency — gated behind webrtc-p2p feature
webrtc = { version = "0.12", optional = true }

# HTTP + WebSocket
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "timeout"] }

# Config + serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus-client = "0.22"
anyhow = "1"

# Crypto (HMAC for DataChannel)
hmac = "0.12"
sha2 = "0.10"

# Crypto (Ed25519 signing.pem for link token signing, D238)
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core", "alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
pkcs8 = { version = "0.10", features = ["pem"] }
toml = "0.8"

# Async utilities
# WebSocket client for signaling
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures-util = "0.3"
base64 = "0.22"
async-trait = "0.1"
bytes = "1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }


[features]
default = ["capture-v4l2"]
# V4L2 相机采集后端（mediaservo-media capture-v4l2 透传；cfg 门控 host-capturer camera 路径）
capture-v4l2 = ["mediaservo-media/capture-v4l2"]
gstreamer = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
production = ["gstreamer"]
# Legacy P2P WebRTC transport (webrtc-rs)
webrtc-p2p = ["dep:webrtc"]
[dev-dependencies]
tempfile = "3"
libc = "0.2"
tokio-tungstenite = { version = "0.24", features = ["connect"] }
