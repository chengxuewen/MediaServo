# MediaServo G2 device registry — server-side device credentials (D-H11 connection-level identity)
#
# Provisioning flow:
#   1. On the vehicle: `mediaservo host init` generates the instance identity identity.json (device_id: ms-<12hex>, device_secret: <64hex>)
#   2. The operator copies device_id/device_secret into this file:
#      - Linux:   echo -n "<device_id>:<device_secret>" | sha256sum  → yields 64 hex
#      - Handy:    mediaservo server hash-device <device_id> <secret>  (H-phase CLI)
#   3. Fill in secret_hash: "sha256:<the 64 hex obtained above>"
#   4. Restart the server (`./mediaservo.sh restart server`) — the registry loads at startup
#
# Storage decision (G2): the client carries the secret in plaintext over TLS on the wire (same tier as PSK),
# so the registry stores only the one-way hash sha256(device_id + ":" + device_secret) — device_id acts as a per-device salt.
# Comparison is constant-time (subtle), guarding against timing side channels. Upgrade path: argon2id in phase H (prefix argon2:).
# Removing a device: delete its entry (new connections are refused immediately, established sessions live until disconnect).
# Error codes: auth failures return a uniform Error 4010 with a uniform message "device authentication failed: invalid
# device credentials" (unknown device vs wrong secret are byte-identical — anti-enumeration, anti-timing; the distinction only reaches audit logs).
# Half-carried credentials (id only or secret only) get a separate message hinting at the shape error.
#
# Example (placeholder — delete or replace):
# devices:
#   ms-0a1b2c3d4e5f:
#     secret_hash: "sha256:2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae"
