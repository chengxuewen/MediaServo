[package]
name = "mediaservo-node"
version.workspace = true
edition.workspace = true
description = "MediaServo Node.js bindings — napi-rs direct bindings to the Rust SDK (same shape as livekit rtc-ffi-bindings)"
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["compat-mode", "async", "napi6"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
mediaservo-common = { path = "../../../../crates/mediaservo-common" }
mediaservo-field = { path = "../../../../crates/mediaservo-field" }
mediaservo-link = { path = "../../../../crates/mediaservo-link" }
mediaservo-deck = { path = "../../../../crates/mediaservo-deck", features = ["backend-ffmpeg"] }
serde_json = "1"
tracing = "0.1"

[build-dependencies]
napi-build = "2"
