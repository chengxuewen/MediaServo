[workspace]
name = "mediaservo"
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

# Phase 1 base dependencies — always installed (Rust + GStreamer)
[dependencies]
rust = ">=1.85.0,<2"
flatbuffers = ">=24.3.25,<26"
python = "3.12.*"
pip = ">=24.0,<26"
pyyaml = ">=6.0,<7"  # build-cli: mediaservo config validate (PIT-76 审核 BLOCKER-2)
ripgrep = ">=14.1.0,<15"
# GStreamer 1.24+ (gstreamer-rs 0.23 min=1.14, tested=1.24)
gstreamer = ">=1.24.0,<2"
gst-plugins-base = ">=1.24.0,<2"
gst-plugins-good = ">=1.24.0,<2"
gst-plugins-bad = ">=1.24.0,<2"
pkg-config = ">=0.29.2,<1"
zlib = ">=1.2,<2"

# Development tools (cmake for webrtc-sys, lld for fast linking, extra GStreamer codecs)
[feature.dev.dependencies]
cmake = ">=3.28.0,<4"
lld = ">=18.0,<19"
gst-plugins-ugly = ">=1.24.0,<2"
gst-libav = ">=1.24.0,<2"
compilers = ">=1.0,<2"
clang = ">=15,<20"
llvm = ">=15,<20"
libclang = ">=15,<20"
meson = ">=1.1.0,<2"
ninja = ">=1.11,<2"
openssl = ">=3,<4"

[feature.dev.tasks]
# === Cargo tasks ═════════════════════════════════════════════════
# 不需要 mediasoup 的 crate — 原生编译 (所有平台)
check = "cargo check --workspace --exclude mediaservo-server"
build = "cargo build --workspace --exclude mediaservo-server"
test = "cargo test --workspace --exclude mediaservo-server"
lint = "cargo clippy --workspace --all-targets -- -D warnings"
# === Bindings tasks（绑定矩阵, link/deck/field × c/cxx/py）===
# cdylib 构建 + dev .so.<MAJOR> symlink（D241: DT_NEEDED 解析）
build-c = "cargo build -p mediaservo-field-c -p mediaservo-link-c -p mediaservo-deck-c && ln -sf libmediaservo_field.so target/debug/libmediaservo_field.so.0 && ln -sf libmediaservo_link.so target/debug/libmediaservo_link.so.0 && ln -sf libmediaservo_deck.so target/debug/libmediaservo_deck.so.0"
# C++ header-only 绑定测试（g++ 编译 + 运行断言）
test-cxx = "bash scripts/test-cxx.sh"
# Python ctypes 绑定测试（stdlib unittest）
test-py = "MEDIASERVO_LIB_DIR=$PWD/target/debug python3 -m unittest discover -s bindings/python/mediaservo/tests"
# 跨语言 parity（D227 ⑤: 同序列三端断言一致）
parity-bindings = "bash scripts/parity_bindings.sh"
# ABI 漂移门禁（D248/L2: header 声明 ↔ .so 导出对照）
abi-drift = "bash scripts/check-abi-drift.sh"
# 绑定层 live e2e（三语言正向链路回归, 需 server）
e2e-bindings = "bash scripts/e2e-bindings.sh"

# mediaservo-server — Docker 编译 (mediasoup C++ Worker 需要 Linux + meson)
check-server = "sh -c 'scripts/docker-cargo.sh check -p mediaservo-server --features sfu-mediasoup'"
build-server = "sh -c 'scripts/docker-cargo.sh build -p mediaservo-server --features sfu-mediasoup'"
test-server = "sh -c 'scripts/docker-cargo.sh test -p mediaservo-server --features sfu-mediasoup'"

# mediaservo-server — 原生编译（unset MESON_ARGS/MESON: conda gcc 注入 -Dbuildtype=release 与 tasks.py --buildtype 冲突；unset MESON 让 tasks.py 回落官方 pip 自装 meson==1.11.2+ninja，首次联网 pip 后续缓存）
check-server-native = "sh -c 'unset MESON_ARGS; unset MESON; cargo check -p mediaservo-server'"
build-server-native = "sh -c 'unset MESON_ARGS; unset MESON; cargo build -p mediaservo-server'"
test-server-native = "sh -c 'unset MESON_ARGS; unset MESON; cargo test -p mediaservo-server'"


# 工具 (无变更)
format = "cargo fmt --all -- --check"
format-fix = "cargo fmt --all"
audit = "cargo deny check"
coverage = "cargo tarpaulin --workspace --exclude mediaservo-server --out Html --out Lcov"
test-gstreamer = "LD_LIBRARY_PATH=$PIXI_PROJECT_ROOT/.pixi/envs/dev/lib:$LD_LIBRARY_PATH DYLD_LIBRARY_PATH=$PIXI_PROJECT_ROOT/.pixi/envs/dev/lib:$DYLD_LIBRARY_PATH cargo test -p mediaservo-codec --features backend-gstreamer"
test-sfu = "cargo test -p mediaservo-server --features sfu-mediasoup"

# Docker compose tasks
server = "docker compose up"
server-dev = "docker compose -f docker-compose.dev.yml up"
# CI tools (lightweight CI stages)
[feature.ci.dependencies]

[feature.test.dependencies]

# test env 依赖（空表声明，dev 已含测试所需）

[feature.ci.tasks]
ci-check = "cargo check --workspace"
ci-lint = "cargo clippy --workspace --all-targets -- -D warnings"
ci-test = "cargo test --workspace"

# Activation — set MESON for mediasoup-sys (avoids pip-installed meson)
[activation]
env = { MESON = "$CONDA_PREFIX/bin/meson", NINJA = "$CONDA_PREFIX/bin/ninja", LIBCLANG_PATH = "$CONDA_PREFIX/lib", PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig", PATH = "$CONDA_PREFIX/bin:$PATH" }

# Jetson (linux-aarch64): 统一使用 JetPack 系统工具链 (gcc 10.5) 构建 host/client。
# conda 交叉编译器 (GCC 14.4) 无法干净链接 JetPack 系统库 (glibc 2.35 冲突 +
# tegra 传递依赖 libEGL/libv4lconvert 仅在系统 multiarch 目录) — 上游 livekit
# 官方 Jetson 流程即为系统工具链。CARGO_TARGET_*_LINKER 必须显式覆盖:
# conda rust.sh 会设置它指向 conda cc, 优先级高于 .cargo/config.toml (PIT-85)。
# CFLAGS/CXXFLAGS/LDFLAGS 清空: 移除 conda 注入的 -isystem/-L, 保证全链路一致。
[target.linux-aarch64.activation.env]
CC = "/usr/bin/gcc"
CXX = "/usr/bin/g++"
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER = "/usr/bin/gcc"
CFLAGS = ""
CXXFLAGS = ""
LDFLAGS = ""

# Environments — composable feature groups
[environments]
runtime = { features = [] }
dev = { features = ["dev"] }
test = { features = ["dev", "test"] }
ci = { features = ["dev", "test", "ci"] }
default = { features = ["dev", "test"] }

# Global tasks (available in all environments)
[tasks]
init = "scripts/pixi-init.sh"
shell = "scripts/pixi-shell.sh"
